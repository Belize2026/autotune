name: Build plugins

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.1.0); leave empty to just build"
        required: false
        default: ""

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022
          - name: Linux
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxinerama-dev libfreetype6-dev libfontconfig1-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DHARDTUNE_COPY_PLUGIN=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      # Ad-hoc signature so the bundles load on Apple-silicon Macs.
      - name: Codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - "build/HardTune_artefacts/Release/AU/AUTISMIDOL AUTOTUNE.component"
          codesign --force --deep -s - "build/HardTune_artefacts/Release/VST3/AUTISMIDOL AUTOTUNE.vst3"

      # Zip the bundles ourselves: upload-artifact does not preserve the
      # executable bits that .component/.vst3 bundles need on macOS/Linux.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          ditto -c -k --keepParent "build/HardTune_artefacts/Release/AU/AUTISMIDOL AUTOTUNE.component" dist/AUTISMIDOL-AUTOTUNE-AU-macOS.zip
          ditto -c -k --keepParent "build/HardTune_artefacts/Release/VST3/AUTISMIDOL AUTOTUNE.vst3" dist/AUTISMIDOL-AUTOTUNE-VST3-macOS.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          Compress-Archive -Path "build/HardTune_artefacts/Release/VST3/AUTISMIDOL AUTOTUNE.vst3" -DestinationPath dist/AUTISMIDOL-AUTOTUNE-VST3-Windows.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cd build/HardTune_artefacts/Release/VST3
          zip -r "$GITHUB_WORKSPACE/dist/AUTISMIDOL-AUTOTUNE-VST3-Linux.zip" "AUTISMIDOL AUTOTUNE.vst3"

      - uses: actions/upload-artifact@v4
        with:
          name: HardTune-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

      # The raw Windows VST3 bundle as its own artifact, per-push.
      - name: Upload Windows VST3 bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AUTISMIDOL-AUTOTUNE.vst3
          path: build/HardTune_artefacts/Release/VST3/AUTISMIDOL AUTOTUNE.vst3
          if-no-files-found: error

      # ----------------------------------------------------------------
      # Installers: macOS .pkg (AU + VST3 into /Library/Audio/Plug-Ins)
      # and Windows Inno Setup .exe (VST3 into Common Files\VST3).
      # ----------------------------------------------------------------
      - name: Build installer (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir pkg-components dist-installer
          chmod +x installer/macos/scripts/preinstall
          pkgbuild --component "build/HardTune_artefacts/Release/AU/AUTISMIDOL AUTOTUNE.component" \
                   --install-location /Library/Audio/Plug-Ins/Components \
                   --identifier com.belize2026.hardtune.au \
                   --version 0.8.0 \
                   --scripts installer/macos/scripts \
                   pkg-components/HardTune-AU.pkg
          pkgbuild --component "build/HardTune_artefacts/Release/VST3/AUTISMIDOL AUTOTUNE.vst3" \
                   --install-location /Library/Audio/Plug-Ins/VST3 \
                   --identifier com.belize2026.hardtune.vst3 \
                   --version 0.8.0 \
                   pkg-components/HardTune-VST3.pkg
          productbuild --package pkg-components/HardTune-AU.pkg \
                       --package pkg-components/HardTune-VST3.pkg \
                       dist-installer/AUTISMIDOL-AUTOTUNE-Installer-macOS.pkg

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /O"dist-installer" installer\windows\HardTune.iss

      - name: Upload installer
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: HardTune-Installer-${{ matrix.name }}
          path: dist-installer/
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Pushing a version tag (v0.1.0, v0.2.0, ...) — or manually running the
  # workflow with a release_tag input — publishes the installers and plugin
  # bundles to the repo's Releases page, giving permanent download links
  # that don't need a GitHub login and never expire.
  # ------------------------------------------------------------------
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir release
          cp artifacts/HardTune-Installer-macOS/AUTISMIDOL-AUTOTUNE-Installer-macOS.pkg release/
          cp artifacts/HardTune-Installer-Windows/AUTISMIDOL-AUTOTUNE-Installer-Windows.exe release/
          cp artifacts/HardTune-macOS/*.zip release/
          cp artifacts/HardTune-Windows/*.zip release/
          cp artifacts/HardTune-Linux/*.zip release/
          ls -l release

      # Create the release as a DRAFT first: drafts are invisible to
      # /releases/latest, so the download links never point at a release
      # whose files are still uploading (that window used to 404).
      - uses: softprops/action-gh-release@v2
        id: draft_release
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Installing

            **macOS (Logic Pro etc.):** download `AUTISMIDOL-AUTOTUNE-Installer-macOS.pkg`,
            right-click it → Open (it is unsigned), and follow the installer.
            It puts the AU and VST3 into `/Library/Audio/Plug-Ins`. Then rescan
            your plugins (Logic: Settings → Plug-in Manager).

            **Windows:** download `AUTISMIDOL-AUTOTUNE-Installer-Windows.exe`. If SmartScreen
            appears, click "More info" → "Run anyway", then follow the installer.
            It puts the VST3 into `C:\Program Files\Common Files\VST3`. Then
            rescan your plugins in your DAW.

            The zip files are the raw plugin bundles for manual installation —
            see the README for where to copy them.

      # Flip the draft live only after every asset is fully uploaded.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${{ steps.draft_release.outputs.id }}" \
            -d '{"draft": false, "make_latest": "true"}' > /dev/null
          echo "Release published"

      # Prove the user-facing links actually work before calling it done.
      - name: Verify download links
        run: |
          sleep 15
          for file in AUTISMIDOL-AUTOTUNE-Installer-macOS.pkg AUTISMIDOL-AUTOTUNE-Installer-Windows.exe; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L \
              "https://github.com/${{ github.repository }}/releases/latest/download/$file")
            echo "$file -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "Download link broken!" >&2
              exit 1
            fi
          done
